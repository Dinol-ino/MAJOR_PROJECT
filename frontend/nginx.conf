server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads are bounded by the backend (MAX_FILE_SIZE_MB); leave headroom for multipart overhead.
    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # API: strip the /api prefix, exactly as the Vite dev proxy does.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Server-sent events (chat streaming, model download progress) must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        try_files $uri /index.html;
    }
}
