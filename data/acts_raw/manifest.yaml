# Statutory corpus manifest.
#
# One entry per raw text file in this directory. Every value here is provenance
# METADATA that an operator records after checking the official source; the
# application never invents it. Leave a field empty rather than guessing.
#
#   legal_status: in_force | amended | repealed | unverified
#   verified_at:  ISO date on which the file's text was checked against source_url
#                 (empty => the Statute Library shows the act as "unverified").
#
# Files without an entry are still indexed, but marked unverified with no
# source URL, version or dates.

