name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (unit, integration, security)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies (CPU-only torch)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Import check
        working-directory: backend
        run: python -c "import app.main"
        env:
          JWT_SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnop
      - name: Run tests (hermetic; no Ollama, no network, temp stores)
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies (CPU-only torch)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Start backend (temp stores, no Ollama, offline)
        working-directory: backend
        env:
          DATABASE_URL: ""
          SQLITE_DB_PATH: /tmp/e2e/db.sqlite
          CHROMA_PERSIST_DIR: /tmp/e2e/chroma
          BM25_INDEX_DIR: /tmp/e2e/bm25
          VAULT_FILES_DIR: /tmp/e2e/vault_files
          PROVISIONING_DB_PATH: /tmp/e2e/provisioning.db
          OLLAMA_URL: "http://127.0.0.1:9"
          NETWORK_MODE: OFFLINE
          AUTO_PULL_ON_STARTUP: "false"
          MODEL_WARMUP_ON_STARTUP: "false"
          CLOUD_FALLBACK_ENABLED: "false"
          # Registration now defaults to closed once the workspace has an owner; the
          # E2E global-setup registers a throwaway practitioner on every run.
          AUTH_REGISTRATION_OPEN: "true"
          JWT_SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnop
          SECRET_KEY: ci-only-vault-key-0123456789abcdefghijklmnop
        run: |
          mkdir -p /tmp/e2e
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/e2e/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health >/dev/null || { cat /tmp/e2e/backend.log; exit 1; }
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite
        working-directory: frontend
        run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  containers:
    name: Container build & compose validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build images (no push)
        run: docker compose build backend frontend