services:
  postgres:
    # Opt-in only. DFrag points at the PostgreSQL named by DFRAG_PG_HOST (see the backend
    # service), which is a shared instance on another machine. This service stays defined
    # so a self-contained local stack is one flag away and the pg-data volume is never
    # orphaned:
    #     docker compose --profile local-db up -d
    # then set DFRAG_PG_HOST=postgres in .env so the backend uses it.
    profiles: ["local-db"]
    image: postgres:15-alpine
    environment:
      # Defaults match the credentials existing pg-data volumes were initialised with, so upgrading
      # does not lock you out of your data. Set DFRAG_PG_* in .env for new deployments; changing them
      # on an existing volume also requires ALTER USER inside PostgreSQL.
      POSTGRES_USER: ${DFRAG_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${DFRAG_PG_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DFRAG_PG_DB:-dfrag_memory}
    ports:
      # Loopback only: the database is never exposed to the LAN.
      - "127.0.0.1:${DFRAG_PG_HOST_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ollama:
    # Opt-in only. Ollama runs natively on this host and already owns 11434, so this
    # container cannot bind that port, and running it would mean downloading every
    # model a second time into ollama-models. The backend talks to the host daemon via
    # DFRAG_OLLAMA_URL instead. To run a containerised Ollama on a machine without a
    # native one:
    #     docker compose --profile local-ollama up -d
    # and set DFRAG_OLLAMA_URL=http://ollama:11434 in .env.
    profiles: ["local-ollama"]
    image: ollama/ollama:0.11.3
    container_name: dfrag-ollama
    ports:
      # Loopback only: the model runtime API has no authentication of its own.
      - "127.0.0.1:${DFRAG_OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      # ollama/ollama image has no curl; use the bundled CLI for health.
      # start_period extended: first multi-GB pull can keep the daemon busy.
      test: ["CMD-SHELL", "ollama ps || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${DFRAG_REDIS_HOST_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${DFRAG_BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - chroma-data:/workspace/chroma_db
      - sqlite-data:/workspace/db
      - bm25-data:/workspace/bm25_index
      # ORIGINAL uploaded documents: the canonical copy. Chroma/BM25 above are derived
      # and rebuildable from this; do not lose it (survives `down`, lost only on `down -v`).
      - vault-files:/workspace/vault_files
      # Statutory corpus (text + manifest.yaml) is read-only inside the container.
      - ./data/acts_raw:/workspace/data/acts_raw:ro
    environment:
      # Container-internal wiring only; model choice, secrets and policy come from .env.
      # DFRAG_PG_HOST selects the database: a LAN address for the shared instance, or
      # `postgres` for the local-db profile above. Host and port are configuration, never
      # hardcoded here, so the same compose file serves both deployments.
      - DATABASE_URL=postgresql://${DFRAG_PG_USER:-postgres}:${DFRAG_PG_PASSWORD:-postgrespassword}@${DFRAG_PG_HOST:-postgres}:${DFRAG_PG_PORT:-5432}/${DFRAG_PG_DB:-dfrag_memory}
      - DB_ALLOW_SQLITE_FALLBACK=false
      # Defaults to the native Ollama on the host, reached through extra_hosts below.
      # Set DFRAG_OLLAMA_URL=http://ollama:11434 to use the local-ollama profile instead.
      - OLLAMA_URL=${DFRAG_OLLAMA_URL:-http://host.docker.internal:11434}
      - REDIS_URL=redis://redis:6379/0
      - ANONYMIZED_TELEMETRY=False
      - CHROMA_PERSIST_DIR=/workspace/chroma_db
      - BM25_INDEX_DIR=/workspace/bm25_index
      - VAULT_FILES_DIR=/workspace/vault_files
      - SQLITE_DB_PATH=/workspace/db/audit_log.db
      - ACTS_RAW_DIR=/workspace/data/acts_raw
      # Persisted via the sqlite-data named volume (survives `down`, lost only on `down -v`).
      - PROVISIONING_DB_PATH=/workspace/db/provisioning.db
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      # Only redis is managed by this project. PostgreSQL and Ollama both run natively
      # on the host, outside compose's lifecycle, and depending on a profiled service
      # that is not active is an error.
      #
      # Losing those two gates is safe: the backend tolerates an unreachable database
      # with bounded retries and then 503, never a silent SQLite fallback
      # (DB_ALLOW_SQLITE_FALLBACK stays false), and the healthcheck below gates the
      # frontend on /health/db — so a missing dependency surfaces as an unhealthy
      # backend rather than as a running app serving nothing.
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; r=httpx.get('http://localhost:8000/health/db', timeout=5); sys.exit(0 if r.status_code == 200 and r.json().get('status') != 'offline' else 1)"]
      interval: 20s
      timeout: 10s
      retries: 5
      # Cold imports (torch/transformers/spacy) take minutes on slow/full disks.
      start_period: 180s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${DFRAG_FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  pg-data:
  chroma-data:
  sqlite-data:
  bm25-data:
  vault-files:
  ollama-models:
